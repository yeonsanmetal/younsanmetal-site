<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>문의함 — 연산메탈㈜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --steel: #17263a; --blue: #1d4aa8; --zinc: #e7eaed; --safety: #f2c230; --muted: #55606d; --line: #c9cfd6; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "IBM Plex Sans KR", "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.6; color: var(--steel); background: var(--zinc); word-break: keep-all; }
  :focus-visible { outline: 3px solid var(--safety); outline-offset: 2px; }
  .wrap { width: min(720px, 100% - 32px); margin: 0 auto; padding-block: 32px 64px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  input[type=password] { width: 100%; font: inherit; font-size: 18px; padding: 14px; border: 1.5px solid var(--line); border-radius: 4px; }
  button { font: inherit; cursor: pointer; border-radius: 4px; }
  .primary { margin-top: 12px; width: 100%; padding: 14px; border: 0; background: var(--steel); color: #fff; font-weight: 700; font-size: 17px; }
  .err { color: #b3261e; font-weight: 700; min-height: 1.6em; }
  .count { background: var(--steel); color: #fff; padding: 20px; border-radius: 4px; margin-bottom: 20px; display: flex; align-items: baseline; gap: 12px; }
  .count b { font-size: 44px; line-height: 1; color: var(--safety); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .ghost { background: transparent; border: 1.5px solid var(--steel); padding: 8px 14px; color: var(--steel); }
  .card { background: #fff; border-radius: 4px; padding: 18px; margin-bottom: 12px; border-left: 5px solid var(--line); }
  .card.new { border-left-color: var(--safety); }
  .meta { color: var(--muted); font-size: 14px; }
  .name { font-weight: 700; font-size: 18px; margin: 2px 0; }
  .contact { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 700; font-size: 18px; text-decoration: underline; }
  .msg { margin: 10px 0 14px; white-space: pre-wrap; }
  .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .status button { padding: 12px 4px; border: 1.5px solid var(--line); background: #fff; color: var(--steel); }
  .status button[aria-pressed=true] { background: var(--steel); border-color: var(--steel); color: #fff; font-weight: 700; }
  .empty { background: #fff; padding: 24px; border-radius: 4px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>연산메탈 견적 문의함</h1>

  <form id="login">
    <label for="pw">관리자 비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">문의함 열기</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>

  <section id="box" hidden>
    <div class="count"><b id="new-count">0</b><span>건의 새 문의</span></div>
    <div class="bar">
      <span class="meta" id="total"></span>
      <button class="ghost" id="logout" type="button">잠그기</button>
    </div>
    <p class="err" id="box-err" role="alert"></p>
    <div id="list"></div>
  </section>
</main>

<script>
  const KEY = 'ym-admin-pw';
  const STATUSES = ['새 문의', '연락함', '완료'];
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => new Date(s).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  async function api(method, body) {
    const pw = sessionStorage.getItem(KEY) || '';
    const r = await fetch('/api/admin', {
      method, headers: { 'x-admin-password': pw, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { lock('비밀번호가 맞지 않아요.'); throw new Error(''); }
    if (!r.ok) throw new Error(j.error || '불러오지 못했어요.');
    return j;
  }

  function lock(message) {
    sessionStorage.removeItem(KEY);
    $('box').hidden = true; $('login').hidden = false;
    $('login-err').textContent = message || '';
    $('pw').value = ''; $('pw').focus();
  }

  function render(rows) {
    $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
    $('total').textContent = `전체 ${rows.length}건 · 최신순`;
    const list = $('list'); list.textContent = '';
    if (!rows.length) { list.innerHTML = '<p class="empty">아직 들어온 문의가 없어요.</p>'; return; }
    for (const row of rows) {
      const card = document.createElement('article');
      card.className = 'card' + (row.status === '새 문의' ? ' new' : '');
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = fmt(row.created_at);
      const name = document.createElement('div'); name.className = 'name'; name.textContent = row.name;
      const contact = document.createElement('button'); contact.type = 'button'; contact.className = 'contact'; contact.textContent = row.contact;
      contact.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(row.contact); contact.textContent = row.contact + ' (복사됨)'; setTimeout(() => (contact.textContent = row.contact), 1500); }
        catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents(contact); s.removeAllRanges(); s.addRange(rg); }
      });
      const msg = document.createElement('p'); msg.className = 'msg'; msg.textContent = row.message || '(제품·수량 없음)';
      const st = document.createElement('div'); st.className = 'status';
      for (const s of STATUSES) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = s; b.setAttribute('aria-pressed', String(row.status === s));
        b.addEventListener('click', async () => {
          if (row.status === s) return;
          try { await api('PATCH', { id: row.id, status: s }); load(); } catch (e) { if (e.message) $('box-err').textContent = e.message; }
        });
        st.append(b);
      }
      card.append(meta, name, contact, msg, st);
      list.append(card);
    }
  }

  async function load() {
    $('box-err').textContent = '';
    try {
      const { rows } = await api('GET');
      $('login').hidden = true; $('box').hidden = false; $('login-err').textContent = '';
      render(rows);
    } catch (e) { if (e.message) { $('login').hidden = true; $('box').hidden = false; $('box-err').textContent = e.message; } }
  }

  $('login').addEventListener('submit', (e) => {
    e.preventDefault();
    sessionStorage.setItem(KEY, $('pw').value);
    load();
  });
  $('logout').addEventListener('click', () => lock(''));
  if (sessionStorage.getItem(KEY)) load(); else $('pw').focus();
</script>
</body>
</html>
